# 코스피 지수를 주기적으로 받아 kospi.json을 갱신한다.
# 한국 장 시간(평일 09:00~15:30 KST = 00:00~06:30 UTC)에 20분마다, 장 마감 후 한 번 더 실행한다.
# GitHub의 schedule 실행은 몇 분 늦어질 수 있다.
name: Update KOSPI

on:
  schedule:
    - cron: "*/20 0-6 * * 1-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kospi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch KOSPI
        run: python scripts/update_kospi.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- kospi.json; then
            echo "kospi.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kospi.json
          git commit -m "Update KOSPI data"
          git push
